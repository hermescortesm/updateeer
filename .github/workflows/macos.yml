name: macOS

on:
  push:
    branches: [dev]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust cache
        uses: swatinem/rust-cache@v2

      - name: Test
        run: cargo test --release --locked

      - name: Build the .dmg
        run: |
          python3 -m venv .venv
          source .venv/bin/activate
          pip install dmgbuild
          mkdir -p dist
          tools/package-macos.sh aarch64-apple-darwin
          ls -lh dist/*.dmg
          shasum -a 256 dist/*.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: dist/*.dmg

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "Updateeer $GITHUB_REF_NAME" --draft --notes "See the assets below."
          gh release upload "$GITHUB_REF_NAME" dist/*.dmg --clobber
