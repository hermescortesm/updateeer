name: Linux

on:
  push:
    branches: [dev]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release:
        description: Existing release tag to attach the Arch and RPM packages to (e.g. v0.1.2)
        required: false

permissions:
  contents: write

jobs:
  deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test
        run: cargo test --release --locked

      - name: Build
        run: cargo build --release --locked

      - name: Build the .deb
        run: |
          tools/package-deb.sh
          sha256sum dist/*.deb

      - uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: dist/*.deb

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "Updateeer $GITHUB_REF_NAME" --notes "See the assets below."
          gh release upload "$GITHUB_REF_NAME" dist/*.deb --clobber

  arch:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Tools
        run: pacman -Syu --noconfirm base-devel git rust sudo github-cli

      - uses: actions/checkout@v4

      - name: Build the package
        run: |
          git config --global --add safe.directory "$PWD"
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          useradd -m builder
          mkdir -p /build dist
          git archive --prefix="updateeer-$version/" -o "/build/updateeer-$version.tar.gz" HEAD
          cp packaging/arch/PKGBUILD /build/
          chown -R builder /build
          su builder -c "cd /build && UPDATEEER_VERSION=$version makepkg --noconfirm --nodeps -f"
          cp "/build/updateeer-$version-1-$(uname -m).pkg.tar.zst" "dist/Updateeer-$version-linux-$(uname -m).pkg.tar.zst"
          sha256sum dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: linux-arch
          path: dist/*.pkg.tar.zst

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release || github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "Updateeer $GITHUB_REF_NAME" --notes "See the assets below."
          gh release upload "$TAG" dist/*.pkg.tar.zst --clobber

  rpm:
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - name: Tools
        run: dnf install -y rust cargo gcc rpm-build git gh

      - uses: actions/checkout@v4

      - name: Build the .rpm
        run: |
          cargo build --release --locked
          tools/package-rpm.sh
          sha256sum dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: linux-rpm
          path: dist/*.rpm

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release || github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "Updateeer $GITHUB_REF_NAME" --notes "See the assets below."
          gh release upload "$TAG" dist/*.rpm --clobber
